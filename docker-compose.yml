# The full stack. `python -m drishti up` wraps this.
#
# Note: the docker daemon was not running on the audited machine -- start
# Docker Desktop first. Everything except postgres and redis also runs
# natively (`drishti api`, `npm run dev`), so a broken docker install never
# blocks development.

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drishti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drishti}
      POSTGRES_DB: ${POSTGRES_DB:-drishti}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drishti}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn drishti.api.app:app --host 0.0.0.0 --port 8000 --reload
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      DRISHTI_DATA_DIR: /app/data
      # Copilot credential. Compose interpolates these from the host's .env --
      # the container cannot read that file, because only ./backend and ./data
      # are mounted, so `config._load_dotenv()` finds nothing at /app/.env.
      # Without this passthrough, setting GEMINI_API_KEY in .env works natively
      # and does nothing at all under `drishti up`, which is the kind of
      # difference that gets debugged as a broken key.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # GPU-enabled Celery worker. This is where CUDA actually lives -- the api
  # image ships no torch and requests no device, so anything needing the
  # accelerator is enqueued onto the gpu queue and executed here.
  #
  # Requires the NVIDIA Container Toolkit. Verified on the reference machine:
  # `docker run --gpus all` reaches an RTX 5070 Laptop GPU, compute cap 12.0.
  ml-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.gpu
    command: >
      celery -A drishti.tasks.app worker
      --loglevel=info
      --concurrency=${CELERY_CONCURRENCY:-2}
      --queues=default,gpu
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      DRISHTI_DATA_DIR: /app/data
      DRISHTI_CHECKPOINT_DIR: /app/checkpoints
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Copilot credential. Compose interpolates these from the host's .env --
      # the container cannot read that file, because only ./backend and ./data
      # are mounted, so `config._load_dotenv()` finds nothing at /app/.env.
      # Without this passthrough, setting GEMINI_API_KEY in .env works natively
      # and does nothing at all under `drishti up`, which is the kind of
      # difference that gets debugged as a broken key.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      LLM_API_KEY: ${LLM_API_KEY:-}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      # Read-only .git so tracking.git_commit() can stamp every run with the
      # code that produced it. Without this the worker records "unknown" and
      # no experiment is reproducible.
      - ./.git:/app/.git:ro
      - ml_checkpoints:/app/checkpoints
      - hf_cache:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
#    deploy:
 #     resources:
  #      reservations:
   #       devices:
     #       - driver: nvidia
       #       count: all
         #     capabilities: [gpu]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: >
      sh -c "pip install --no-cache-dir psycopg2-binary >/dev/null &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER:-drishti}:${POSTGRES_PASSWORD:-drishti}@postgres:5432/mlflow
      --default-artifact-root /mlruns"
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_artifacts:/mlruns
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:${API_PORT:-8000}
      # A host-side edit raises no inotify event inside the container, so
      # without this Vite never rebuilds and the browser keeps serving the
      # module graph from container start. See frontend/vite.config.ts.
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  frontend_modules:
  ml_checkpoints:
  mlflow_artifacts:
  hf_cache: # model downloads survive container rebuilds
